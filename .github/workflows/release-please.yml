name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Keep the registry URL but remove setup-node's placeholder authentication.
      - name: Enable npm OIDC trusted publishing
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = process.env.NPM_CONFIG_USERCONFIG;
            writeFileSync(path, readFileSync(path, "utf8").split("\n").filter(line => !line.includes(":_authToken=")).join("\n"));
          '
      - run: pnpm build:npm
      - name: Publish to npm
        working-directory: dist/npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@knowttl/artium-axi@$version" version > /dev/null 2>&1; then
            echo "@knowttl/artium-axi@$version is already published; skipping."
          else
            npm publish --access public --provenance
          fi

  publish-image:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      IMAGE: ghcr.io/knowttl/artium-axi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Record release revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish server image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.release-please.outputs.tag_name }}
          labels: |
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.source=https://github.com/knowttl/artium-axi
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
          provenance: mode=max
      - name: Attest published image digest
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image identity
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          printf 'Image: `%s@%s`\nTag: `%s`\nRevision: `%s`\n' "$IMAGE" "$DIGEST" "$TAG" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain incomplete image publication
        if: ${{ failure() }}
        run: |
          echo '::error::Server image publication is incomplete. Check the failed step. Before the first release, the repository owner must allow Actions packages: write, attestations: write and id-token: write; grant this repository Actions access to any existing GHCR package; and select public package visibility if public pulls are required. See docs/runbook.md for release setup and verification.'
          exit 1
