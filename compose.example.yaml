services:
  artium:
    image: artium-axi:local
    build: .
    read_only: true
    init: true
    mem_limit: 6g
    pids_limit: 192
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=268435456,mode=1777
    volumes:
      - artium-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ARTIUM_AXI_MASTER_KEY_FILE: /run/secrets/artium_master_key
    secrets:
      - artium_master_key
secrets:
  artium_master_key:
    file: ./private/artium_master_key
volumes:
  artium-data:
