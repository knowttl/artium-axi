agent: codex
no_ci: true

commands:
  prepare: "CI=true pnpm install --frozen-lockfile"
  test: "pnpm test:gate"
  lint: "pnpm lint"

auto_fix:
  review: 1
  test: 2

ignore_patterns: []

review:
  path_instructions:
    - path: "**"
      instructions: |
        Review focus for this build: does the change work as its plan task specifies, and is it well designed? Raise functional bugs, broken or missing flows, wrong results, crashes, hangs, data loss, regressions, unhandled errors that break a flow, missing tests for the slice's behaviour, and style, simplification and design-principle issues. Security hardening and threat-model concerns are deferred until the full app is built: do not raise them unless they cause a functional bug.
        Keep code, docs, tests and generated assets generic: no real employer hostnames, tenant names, secret names or credentials.
        Use only fakes, synthetic users and canary credentials during the build; escalate live services, real credentials, deployment and irreversible actions.
        For every repair, identify the reported invariant and inspect its sibling callers, cases and failure paths before editing. Repair the whole invariant in one round, verify through its public interface, then review the whole base-to-head diff again, including earlier repairs. Do not cap valid findings or narrow design/style review.
        Before a repair's focused verification, run pnpm install --frozen-lockfile if dependencies are missing, using the package.json Node and pnpm toolchain. Complete pnpm build before any probe that uses dist. Do not return a repair as verified when dependencies or compiled output prevented verification.
    - path: "**"
      instructions: |
        Test quality: apply the "Test quality" rules in AGENTS.md to every added or changed test. Flag each violation as a finding naming the rule number, the test file:line and the evidence. Respect the listed exemptions. Never ask for a test to be written first or only to raise coverage.

document:
  instructions: |
    README.md owns the generic introduction, installation and quick start.
    README.md owns the group-level capability summary; docs/safety.md owns supported capability boundaries and docs/commands.md owns the client command reference.
    CONTRIBUTING.md owns local validation, container acceptance and compatibility policy.
    docs/runbook.md owns deployment, bootstrap, recovery, rotation, retention and rollback.
    src/shared/api.ts owns API contracts and src/shared/errors.ts owns the error catalogue.
    src/server/config.ts owns executable defaults. Generated references cite these owners.
    Adapter manifests own the reviewed pinned command boundary and resource requirements.
    docs/errors.md and other generated references are rebuilt, never edited manually.
    AGENTS.md owns concise development instructions and pointers, not duplicate design prose.
    Private plans, probes and employer policy exceptions stay outside this code repository.
    Preserve the distinction between local evidence and unverified owner live acceptance.
    Do not run tests or dependency installs again during documentation housekeeping.
    Attach the Test step's validation handoff and saved logs to the final report instead of repeating commands for presentation. Preserve each result's tested head and input identity; documentation edits do not turn historical results into passes for the new candidate. Record any resulting mismatch and leave required final-candidate validation to the Test gate.

test:
  evidence:
    attach_media: false
  instructions: |
    The configured pnpm test:gate command records its base, input identity, selected files and reasons, then runs affected checks or the conservative full fallback once as the baseline.
    Require pnpm test:gate --full before releases and at least weekly for local validation; pnpm test and pnpm check retain the full suite.
    After repairs, rerun pnpm test:gate against the complete base-to-candidate diff; never validate only the last repair.
    Use targeted public CLI, API and browser flows for additional evidence only when needed.
    Reuse baseline evidence instead of rerunning the unchanged full suite.
    Produce a durable validation handoff outside the checkout, and give its absolute path in the Test report so a later run can receive it through its verification plan. Keep raw command logs and selection output alongside it; do not commit process evidence. Read any supplied handoff before choosing additional probes. This handoff does not bypass the configured baseline command or change pipeline rerun behavior.
    For each baseline or additional product/container check, retain: exact command and working directory; start/end UTC and elapsed time; exit status and pass/fail/unverified outcome; tested head and dirty-input state; the complete pnpm test:gate --plan output (base, head, inputSha256, Node, selection, reasons and checks); actual Node/pnpm versions, platform/architecture and frozen root/tools lockfile SHA-256 values; dependency-install result; and raw evidence paths with SHA-256 values. Capture selection/input identity before and after execution; a changed identity cannot establish a pass for either final state. Missing or failed preparation leaves dependent checks unverified.
    For checks using dist, also retain the unmodified dist/.build-evidence.json input and output identities after successful build, and confirm those identities still match after the probe. For containers, retain the raw container-inputs, container-command and container-evidence records, image identities and cleanup results. Include the synthetic fixture/environment selection needed to reproduce each product probe, without secret values. Mark output identity not applicable for checks that do not consume compiled output.
    When considering a saved pass, recompute the existing identities and selection for the candidate, compare the exact command, selected checks, base, relevant input/output digests, installed dependency/toolchain and environment identities, and explain the tested-head relationship. Reuse only a successful, complete record whose applicable identities all match. Missing evidence, changed selection, changed inputs/outputs or uncertain provenance require fresh checks. Never edit the saved record's head or digest, remove HEAD from an identity, infer equivalence from a docs-only label, or count a failure/refusal as a pass. A historical pass may be attached as context even when it is not reusable.
    After repairs, retain earlier results as historical evidence, run the configured gate against the complete base-to-candidate diff, and refresh affected product/container checks for the new input state. End the handoff with the candidate head, a per-check executed/reused/unverified disposition, the saved record used and comparison evidence for each reuse, and outstanding required checks. Documentation housekeeping consumes this handoff without reinstalling dependencies or rerunning checks; any changed required identity remains outstanding rather than being relabeled green.
    Use only fakes, synthetic identities and canary credentials during implementation.
    Never contact a real tenant or appliance and never silently skip required local container checks.
    Record unsupported host-platform checks as unverified rather than pretending they ran.
    You are explicitly authorized to run pnpm test:containers locally against fakes, synthetic identities and canary credentials, including its private BuildKit worker and fake-only Docker networks. Create and remove only the unique artium-test-* resources owned by this run. Never touch other Docker resources, prune globally, change shared daemon settings, or contact real services, tenants or appliances. Dependency/package fetches for pinned image builds are permitted; application probes remain isolated on internal or no-network Docker networks.
    Setup is ordered: use the package.json Node and pnpm toolchain, install frozen dependencies, complete pnpm build, then run fake-service and container probes. Never race probes with compilation. pnpm test:containers reuses one task-owned tmpfs BuildKit cache and removes it with its other resources before returning.
    Require pnpm test:containers when the change touches Dockerfile, .dockerignore, scripts/, tools/, bin/, test/fake-service/, test/runner/, test/walking-skeleton/, src/server/, package.json or pnpm-lock.yaml, and always before a release. Skip container acceptance for src/cli/, docs, workflow and skill-only changes unless a required path also changes. Before merging a release PR, require passing local container evidence for the release candidate as documented in docs/runbook.md; the release workflow's pnpm check does not run containers.
    When container acceptance is required, record command, exit status, timings, environment, head SHA, input digest and compiled-output digest from container-inputs/container-evidence, plus image identities and cleanup. Worker evidence is reusable only when its relevant input and compiled-output digests match the final candidate and the head relationship is explained; changed relevant inputs require fresh checks. A refusal or failed required check is unverified and must be resolved, never silently waived.
