agent: codex
no_ci: true

commands:
  prepare: "CI=true pnpm install --frozen-lockfile"
  test: "pnpm test"
  lint: "pnpm lint"

auto_fix:
  review: 2
  test: 2

ignore_patterns: []

review:
  path_instructions:
    - path: "**"
      instructions: |
        T7.3 reviews the finished design and the entire current codebase, including unchanged code, for security findings. Review authentication, authorization, browser sessions and CSRF, credential encryption and key handling, runner isolation and credential-bearing destinations, input and output boundaries, audit, container hardening, backup, restore and upstream native gates. Raise functional bugs and design issues as well. Fix every high security finding and leave no high finding open. Do not choose a master-key escrow vendor or location, start T7.4 or later, or invent owners or dates for non-high findings. Any non-high finding requiring an owner decision must be an ask-user finding for escalation.
        After each material security fix, rerun hardening, restore and upstream probes through pnpm test:containers after compilation. The full fake-only acceptance block covers those boundaries and owns cleanup. Report findings, severity, evidence and disposition explicitly; passing existing tests alone is not a security review.
        Keep code, docs, tests and generated assets generic: no real employer hostnames, tenant names, secret names or credentials.
        Use only fakes, synthetic users and canary credentials during the build; escalate live services, real credentials, deployment and irreversible actions.
        For every repair, identify the reported invariant and inspect its sibling callers, cases and failure paths before editing. Repair the whole invariant in one round, verify through its public interface, then review the whole base-to-head diff again, including earlier repairs. Do not cap valid findings or narrow design/style review.
        Before a repair's focused verification, run pnpm install --frozen-lockfile if dependencies are missing, using the package.json Node and pnpm toolchain. Complete pnpm build before any probe that uses dist. Do not return a repair as verified when dependencies or compiled output prevented verification.

document:
  instructions: |
    README.md owns the generic introduction, installation and quick start.
    docs/architecture.md owns the clean architecture and supported capability boundaries.
    docs/runbook.md owns deployment, bootstrap, recovery, rotation, retention and rollback.
    src/shared/api.ts owns API contracts and src/shared/errors.ts owns the error catalogue.
    src/server/config.ts owns executable defaults. Generated references cite these owners.
    Adapter manifests own the reviewed pinned command boundary and resource requirements.
    docs/errors.md and other generated references are rebuilt, never edited manually.
    AGENTS.md owns concise development instructions and pointers, not duplicate design prose.
    Private plans, probes and employer policy exceptions stay outside this code repository.
    Preserve the distinction between local evidence and unverified captain live acceptance.
    Do not run tests or dependency installs again during documentation housekeeping.

test:
  instructions: |
    The configured pnpm test command runs the full real local suite once as the baseline.
    Use targeted public CLI, API and browser flows for additional evidence only when needed.
    Reuse baseline evidence instead of rerunning the unchanged full suite.
    Use only fakes, synthetic identities and canary credentials during implementation.
    Never contact a real tenant or appliance and never silently skip required local container checks.
    Record unsupported host-platform checks as unverified rather than pretending they ran.
    You are explicitly authorized to run pnpm test:containers locally against fakes, synthetic identities and canary credentials, including its private BuildKit worker and fake-only Docker networks. Create and remove only the unique artium-test-* resources owned by this run. Never touch other Docker resources, prune globally, change shared daemon settings, or contact real services, tenants or appliances. Dependency/package fetches for pinned image builds are permitted; application probes remain isolated on internal or no-network Docker networks.
    Setup is ordered: use the package.json Node and pnpm toolchain, install frozen dependencies, complete pnpm build, then run fake-service and container probes. Never race probes with compilation. pnpm test:containers reuses one task-owned tmpfs BuildKit cache and removes it with its other resources before returning.
    Container acceptance is mandatory. Record command, exit status, timings, environment, head SHA, input digest and compiled-output digest from container-inputs/container-evidence, plus image identities and cleanup. Worker evidence is reusable only when its relevant input and compiled-output digests match the final candidate and the head relationship is explained; a changed source, test, pin, script or Docker input requires fresh checks. A refusal or failed check is unverified and must be resolved, never silently waived.
